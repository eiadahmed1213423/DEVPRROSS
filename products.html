<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products Page</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;500&display=swap');
body{
    opacity: 0;
    transform: scale(0.98);
    filter: blur(5px);

    animation: pageLoad 0.9s ease forwards;
}

@keyframes pageLoad{
    to{
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }
}

:root {
  --bg: #0a0e1a;
  --surface: #111827;
  --surface2: #1a2236;
  --border: rgba(99,179,237,0.15);
  --accent: #3b82f6;
  --accent-glow: rgba(59,130,246,0.35);
  --green: #22c55e;
  --green-glow: rgba(34,197,94,0.3);
  --text: #e2e8f0;
  --text-muted: #64748b;
  --navbar-h: 60px;
}

* { margin:0; padding:0; box-sizing:border-box; }

html{
  -webkit-text-size-adjust:100%;
}

body {
  background: var(--bg);
  font-family: 'Inter', sans-serif;
  color: var(--text);
  min-height: 100vh;
  overflow-x:hidden;
  background-image:
    radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(99,102,241,0.07) 0%, transparent 60%);
}


.navbar {
  background: rgba(10,14,26,0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 30px;
  min-height: var(--navbar-h);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 300;
  flex-wrap: wrap;
}

.nav-left{
  display:flex;
  align-items:center;
  gap:16px;
}

.menu-toggle{
  width:36px;
  height:36px;
  background:transparent;
  border:1px solid var(--border);
  border-radius:8px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:5px;
  cursor:pointer;
  transition:.2s;
  flex-shrink:0;
}

.menu-toggle:hover{
  border-color:var(--accent);
  box-shadow:0 0 14px var(--accent-glow);
}

.menu-toggle span{
  display:block;
  width:18px;
  height:2px;
  background:var(--text);
  border-radius:2px;
  transition:.25s;
}

.menu-toggle.active span:nth-child(1){
  transform:translateY(7px) rotate(45deg);
}
.menu-toggle.active span:nth-child(2){
  opacity:0;
}
.menu-toggle.active span:nth-child(3){
  transform:translateY(-7px) rotate(-45deg);
}

.logo {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 22px;
  letter-spacing: 3px;
  color: #fff;
  text-shadow: 0 0 20px var(--accent-glow);
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.home-btn {
  padding: 8px 18px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 1px;
  transition: all 0.2s;
  box-shadow: 0 0 14px var(--accent-glow);
}

.home-btn:hover {
  background: #4f7ad6;
  transform: translateY(-2px);
  box-shadow: 0 0 10px var(--accent-glow);
}

.navbar input {
  padding: 8px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  outline: none;
  width: 200px;
  max-width: 100%;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.navbar input::placeholder { color: var(--text-muted); }

.navbar input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.container{
    display:flex;
    align-items:flex-start;
    gap:20px;
    max-width:1400px;
    margin:24px auto;
    padding:0 20px;
}

.sidebar{
    width:260px;
    background:var(--surface);
    border:1px solid var(--border);
    padding:22px;
    position:fixed;
    top:var(--navbar-h);
    left:-300px;
    height:calc(100vh - var(--navbar-h));
    overflow-y:auto;
    z-index:250;
    transition:left .35s ease;
    box-shadow:10px 0 34px rgba(0,0,0,.5);
    border-radius:0 18px 18px 0;
}

.sidebar.open{
    left:0;
}

.sidebar-close{
    position:absolute;
    top:14px;
    right:14px;
    background:transparent;
    border:none;
    color:var(--text-muted);
    font-size:22px;
    line-height:1;
    cursor:pointer;
}

.sidebar-close:hover{
    color:#fff;
}

.menu-overlay{
    position:fixed;
    top:var(--navbar-h);
    left:0;
    right:0;
    bottom:0;
    background:rgba(0,0,0,.55);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
    z-index:200;
}

.menu-overlay.active{
    opacity:1;
    pointer-events:all;
}

.sidebar h3{
    color:white;
    margin-bottom:18px;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:13px;
}

.filter-list{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.filter-list li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 15px;
    border-radius:12px;
    cursor:pointer;
    transition:.25s;
    border:1px solid transparent;
    background:rgba(255,255,255,.02);
}

.filter-list li:hover{
    background:rgba(59,130,246,.08);
    border-color:rgba(59,130,246,.25);
    transform:translateX(4px);
}

.filter-list li.active{
    background:var(--accent);
    color:white;
    border-color:var(--accent);
    box-shadow:0 0 18px rgba(59,130,246,.35);
}

.count{
    background:rgba(255,255,255,.12);
    padding:3px 9px;
    border-radius:20px;
    font-size:12px;
}

.filter-list li.active .count{
    background:white;
    color:var(--accent);
}


.products{
    flex:1;
    min-width:0;
    width:100%;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 15px 15px;
  text-align: center;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}

.card:hover {
  transform: translateY(-5px);
  border-color: rgba(59,130,246,0.4);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(59,130,246,0.15);
  background: var(--surface2);
}

.card:hover::before { opacity: 1; }

.card img {
  width: 270px;
  height: 145px;
  object-fit: contain;
  margin-bottom: 12px;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  transition: filter 0.3s;
  max-width: 100%;

}

.card:hover img {
  filter: drop-shadow(0 6px 18px rgba(59,130,246,0.2));
}

.card h4 {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 15px;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
  color: #fff;
}

.price {
  color: var(--green);
  font-weight: 700;
  font-size: 16px;
  margin-top: 6px;
  text-shadow: 0 0 10px var(--green-glow);
}

.btn {
  margin-top: 12px;
  padding: 7px 18px;
  background: var(--green);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  transition: all 0.2s;
  box-shadow: 0 0 12px var(--green-glow);
}

.btn:hover {
  background: #16a34a;
  transform: translateY(-1px);
  box-shadow: 0 0 20px var(--green-glow);
}

.price-filter{
    margin-top:15px;
}

.price-value{
    margin-bottom:12px;
    font-size:14px;
    color:var(--text);
}

#priceValue{
    color:var(--green);
    font-weight:bold;
}

#priceSlider{
    width:100%;
    accent-color:var(--accent);
    cursor:pointer;
}
#priceInput{
    width: 60px;
    margin-left:10px;
    padding:6px;
    background:var(--surface2);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:6px;
    outline:none;

}
.contact-btn{
  padding: 8px 11px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 1px;
  transition: all 0.2s;
  box-shadow: 0 0 14px var(--accent-glow);
}
.contact-btn:hover {
  background: #4f7ad6;
  transform: translateY(-2px);
  box-shadow: 0 0 10px var(--accent-glow);
}

.about-us{
  padding: 8px 11px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 1px;
  transition: all 0.2s;
  box-shadow: 0 0 14px var(--accent-glow);
}
.about-us:hover{
  background: #4f7ad6;
  transform: translateY(-2px);
  box-shadow: 0 0 10px var(--accent-glow);
}

.spec-filter{
    margin-top:22px;
}

.spec-filter label{
    display:block;
    font-size:12px;
    color:var(--text-muted);
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:6px;
}

.spec-filter select{
    width:100%;
    padding:9px 10px;
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    font-size:13px;
    outline:none;
    margin-bottom:14px;
    cursor:pointer;
    transition:border-color 0.2s, box-shadow 0.2s;
}

.spec-filter select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-glow);
}

.spec-filter select:last-child{
    margin-bottom:0;
}

@media (max-width: 900px) {
  .container{
    padding:0 16px;
  }
}

@media (max-width: 768px) {

  .navbar {
    flex-direction: column;
    align-items: stretch;
    height: auto;
    padding: 14px 16px;
    gap: 12px;
  }

  .nav-left{
    width:100%;
    justify-content:space-between;
  }

  .nav-right {
    width: 100%;
    flex-direction: column;
    gap: 10px;
  }

  .navbar input {
    width: 100%;
  }

  .home-btn, .contact-btn, .about-us {
    width: 100%;
  }

  .container{
    margin:16px auto;
    padding:0 14px;
  }

  .products {
    grid-template-columns: 1fr;
    gap:14px;
  }

  .card {
    width: 100%;
  }

  .card img {
    width: 100%;
    height: auto;
  }

  .sidebar{
    width:82%;
    max-width:320px;
    padding:20px;
  }

}

@media (max-width: 480px) {

  .logo{
    font-size:18px;
    letter-spacing:2px;
  }

  .menu-toggle{
    width:32px;
    height:32px;
  }

  .container{
    padding:0 10px;
    margin:14px auto;
  }

  .card{
    padding:14px 10px 12px;
  }

  .card h4{
    font-size:14px;
  }

  .price{
    font-size:14px;
  }

  .btn{
    padding:6px 14px;
    font-size:11px;
  }

  .sidebar{
    width:90%;
    max-width:280px;
    padding:16px;
  }

  .spec-filter select, #priceInput, .navbar input{
    font-size:12px;
  }

  .home-btn, .contact-btn, .about-us{
    font-size:13px;
    padding:8px 14px;
  }

}
</style>
</head>
<body>

<div class="navbar">
  <div class="nav-left">
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="logo">DEVPROS</div>
  </div>
  <div class="nav-right">
    <button class="home-btn" onclick="window.location.href='index.html'">Home</button>
    <button class="contact-btn" onclick="window.location.href='contact.html'">Contact</button>
    <button class="about-us" onclick="window.location.href='About.html'">About Us</button>
    <input type="text" placeholder="Search products...">
  </div>
</div>

<div class="menu-overlay" id="menuOverlay"></div>

<div class="container">

<div class="sidebar" id="sidebar">

<button class="sidebar-close" id="sidebarClose" aria-label="Close menu">&times;</button>

<h3>Filter By Brand</h3>

<ul class="filter-list">
<li class="active" data-brand="all">
<span>All</span>
<span class="count">4</span>
</li>

<li data-brand="apple">
<span>Apple</span>
<span class="count">1</span>
</li>

<li data-brand="acer">
<span>Acer</span>
<span class="count">1</span>
</li>

<li data-brand="asus">
<span>Asus</span>
<span class="count">1</span>
</li>

<li data-brand="dell">
<span>Dell</span>
<span class="count">1</span>
</li>

</ul>

<div class="price-filter">

    <div class="price-value">
        Max Price:
        <input
            type="number"
            id="priceInput"
            min="0"
            max="700"
            value="700"
        >
    </div>

    <input
        type="range"
        id="priceSlider"
        min="0"
        max="700"
        value="700"
    >

</div>


<div class="spec-filter">

    <h3 style="margin-top:4px;">Specifications</h3>

    <label for="ramFilter">RAM</label>
    <select id="ramFilter">
        <option value="all">All</option>
        <option value="8GB">8GB</option>
        <option value="16GB">16GB</option>
        <option value="32GB">32GB</option>
    </select>

    <label for="processorFilter">Processor</label>
    <select id="processorFilter">
        <option value="all">All</option>
        <option value="i3">Intel i3</option>
        <option value="i5">Intel i5</option>
        <option value="i7">Intel i7</option>
        <option value="i9">Intel i9</option>
        <option value="ryzen3">AMD Ryzen 3</option>
        <option value="ryzen5">AMD Ryzen 5</option>
        <option value="ryzen7">AMD Ryzen 7</option>
        <option value="ryzen9">AMD Ryzen 9</option>
    </select>

    <label for="gpuFilter">GPU (VRAM)</label>
    <select id="gpuFilter">
        <option value="all">All</option>
        <option value="2GB">2GB</option>
        <option value="4GB">4GB</option>
        <option value="6GB">6GB</option>
        <option value="8GB">8GB</option>
    </select>

    <label for="screenFilter">Screen Size</label>
    <select id="screenFilter">
        <option value="all">All</option>
        <option value="15.6">15.6"</option>
        <option value="17.6">17.6"</option>
    </select>

    <label for="storageFilter">Storage</label>
    <select id="storageFilter">
        <option value="all">All</option>
        <option value="128GB">128GB</option>
        <option value="256GB">256GB</option>
        <option value="512GB">512GB</option>
        <option value="1TB">1TB</option>
    </select>

</div>

</div>

    <div class="products">

        <div class="card" data-brand="apple" data-price="650"
          data-ram="8GB" data-processor="none" data-gpu="none" data-screen="13.6" data-storage="256GB">
            <img src="Apple-MacBook-Air-2-up-front-240304-1536x612.webp" alt="Macbook Air 2025">
            <h4>Macbook Air 2025</h4>
            <div class="price">$650</div>
            <button class="btn">Buy</button>
        </div>

        <div class="card" data-brand="acer" data-price="350"
          data-ram="8GB" data-processor="i5" data-gpu="2GB" data-screen="15.6" data-storage="512GB">
            <img src="cde9877d-9c98-4b2b-96c5-c23f9d94ec24.jpg" alt="Acer Aspire 5">
            <h4>Acer Aspire 5</h4>
            <div class="price">$350</div>
            <button class="btn">Buy</button>
        </div>

        <div class="card" data-brand="asus" data-price="420"
            data-ram="16GB" data-processor="i7" data-gpu="4GB" data-screen="15.6" data-storage="512GB">
            <img src="res_4f9b3e6f45190e356241ff1361d3e248.avif" alt="Asus TUF F15">
            <h4>Asus TUF F15</h4>
            <div class="price">$420</div>
            <button class="btn">Buy</button>
        </div>

        <div class="card" data-brand="dell" data-price="545"
            data-ram="16GB" data-processor="i7" data-gpu="6GB" data-screen="17.6" data-storage="1TB">
            <img src="download.webp" alt="Dell G17">
            <h4>Dell G17</h4>
            <div class="price">$545</div>
            <button class="btn">Buy</button>
        </div>

    </div>

</div>


<script>
const priceInput = document.getElementById("priceInput");
const categories = document.querySelectorAll(".filter-list li");
const cards = document.querySelectorAll(".card");

const slider = document.getElementById("priceSlider");
let currentBrand = "all";

const ramFilter = document.getElementById("ramFilter");
const processorFilter = document.getElementById("processorFilter");
const gpuFilter = document.getElementById("gpuFilter");
const screenFilter = document.getElementById("screenFilter");
const storageFilter = document.getElementById("storageFilter");

function applyAllFilters(){

    const maxPrice = Number(priceInput.value);
    const ramVal = ramFilter.value;
    const processorVal = processorFilter.value;
    const gpuVal = gpuFilter.value;
    const screenVal = screenFilter.value;
    const storageVal = storageFilter.value;

    cards.forEach(card=>{

        const price = Number(card.dataset.price);

        const matchesBrand = currentBrand === "all" || card.dataset.brand === currentBrand;
        const matchesPrice = price <= maxPrice;
        const matchesRam = ramVal === "all" || card.dataset.ram === ramVal;
        const matchesProcessor = processorVal === "all" || card.dataset.processor === processorVal;
        const matchesGpu = gpuVal === "all" || card.dataset.gpu === gpuVal;
        const matchesScreen = screenVal === "all" || card.dataset.screen === screenVal;
        const matchesStorage = storageVal === "all" || card.dataset.storage === storageVal;

        if(matchesBrand && matchesPrice && matchesRam && matchesProcessor && matchesGpu && matchesScreen && matchesStorage){

            card.style.display = "block";

            card.animate([
                {opacity:0,transform:"translateY(20px)"},
                {opacity:1,transform:"translateY(0)"}
            ],{
                duration:300,
                fill:"forwards"
            });

        } else {

            card.style.display = "none";

        }

    });

}

categories.forEach(category=>{

category.addEventListener("click",()=>{

categories.forEach(item=>item.classList.remove("active"));
category.classList.add("active");

currentBrand = category.dataset.brand;

applyAllFilters();

if(window.innerWidth <= 768){
    closeMenu();
}

});

});

slider.addEventListener("input", () => {

    priceInput.value = slider.value;

    applyAllFilters();

});
priceInput.addEventListener("input", () => {

    slider.value = priceInput.value;

    applyAllFilters();

});

ramFilter.addEventListener("change", applyAllFilters);
processorFilter.addEventListener("change", applyAllFilters);
gpuFilter.addEventListener("change", applyAllFilters);
screenFilter.addEventListener("change", applyAllFilters);
storageFilter.addEventListener("change", applyAllFilters);

const navbar = document.querySelector(".navbar");
const menuToggle = document.getElementById("menuToggle");
const sidebar = document.getElementById("sidebar");
const menuOverlay = document.getElementById("menuOverlay");
const sidebarClose = document.getElementById("sidebarClose");

function syncNavbarHeight(){
    document.documentElement.style.setProperty("--navbar-h", navbar.offsetHeight + "px");
}

syncNavbarHeight();
window.addEventListener("resize", syncNavbarHeight);
window.addEventListener("load", syncNavbarHeight);

function openMenu(){
    sidebar.classList.add("open");
    menuOverlay.classList.add("active");
    menuToggle.classList.add("active");
}

function closeMenu(){
    sidebar.classList.remove("open");
    menuOverlay.classList.remove("active");
    menuToggle.classList.remove("active");
}

menuToggle.addEventListener("click", () => {
    if(sidebar.classList.contains("open")){
        closeMenu();
    } else {
        openMenu();
    }
});

menuOverlay.addEventListener("click", closeMenu);
sidebarClose.addEventListener("click", closeMenu);

</script>




</body></html>
