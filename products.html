<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVPROS Products</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap');

:root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2236;
    --border: rgba(99,179,237,0.15);
    --accent: #3b82f6;
    --accent-glow: rgba(59,130,246,0.35);
    --green: #22c55e;
    --green-glow: rgba(34,197,94,0.3);
    --text: #e2e8f0;
    --text-muted: #64748b;
    --navbar-h: 64px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
        radial-gradient(
            ellipse 80% 50% at 20% 10%,
            rgba(59,130,246,0.08) 0%,
            transparent 60%
        ),
        radial-gradient(
            ellipse 60% 40% at 80% 80%,
            rgba(99,102,241,0.07) 0%,
            transparent 60%
        );
    opacity: 0;
    transform: scale(0.98);
    filter: blur(5px);
    animation: pageLoad 0.9s ease forwards;
}

@keyframes pageLoad {
    to {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }
}

button,
input,
select {
    font: inherit;
}

/* =========================
   NAVBAR
========================= */

.navbar {
    min-height: var(--navbar-h);
    width: 100%;
    padding: 10px 30px;
    background: rgba(10,14,26,0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 300;
    transition: transform 0.35s ease;
}

.navbar.hide {
    transform: translateY(-100%);
}

.nav-left {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
}

.menu-toggle {
    width: 38px;
    height: 38px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    transition: 0.2s;
    flex-shrink: 0;
}

.menu-toggle:hover {
    border-color: var(--accent);
    box-shadow: 0 0 14px var(--accent-glow);
}

.menu-toggle span {
    display: block;
    width: 18px;
    height: 2px;
    background: var(--text);
    border-radius: 2px;
    transition: 0.25s;
}

.menu-toggle.active span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
}

.menu-toggle.active span:nth-child(2) {
    opacity: 0;
}

.menu-toggle.active span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
}

.logo {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 23px;
    letter-spacing: 3px;
    color: #fff;
    text-shadow: 0 0 20px var(--accent-glow);
    white-space: nowrap;
}

.nav-right {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    min-width: 0;
}

.nav-button {
    padding: 9px 16px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.8px;
    transition: 0.2s;
    box-shadow: 0 0 14px var(--accent-glow);
    white-space: nowrap;
}

.nav-button:hover {
    background: #4f7ad6;
    transform: translateY(-2px);
}

.search-box {
    padding: 9px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    outline: none;
    width: 210px;
    transition: 0.2s;
}

.search-box::placeholder {
    color: var(--text-muted);
}

.search-box:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
}

.cart-btn {
    width: 40px;
    height: 40px;
    padding: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
    flex-shrink: 0;
    position: relative;
}

.cart-btn:hover {
    border-color: var(--green);
    box-shadow: 0 0 14px var(--green-glow);
}

.cart-btn svg {
    width: 20px;
    height: 20px;
}

.cart-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: var(--green);
    color: white;
    font-size: 11px;
    font-weight: 700;
    min-width: 18px;
    height: 18px;
    border-radius: 9px;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    box-shadow: 0 0 8px var(--green-glow);
}

/* =========================
   LAYOUT
========================= */

.container {
    width: min(1400px, 100%);
    margin: 24px auto;
    padding: 0 20px;
    display: flex;
    align-items: flex-start;
    gap: 20px;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 260px;
    flex: 0 0 260px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    position: fixed;
    top: var(--navbar-h);
    left: -300px;
    height: calc(100vh - var(--navbar-h));
    overflow-y: auto;
    z-index: 250;
    transition: left 0.35s ease;
    box-shadow: 10px 0 34px rgba(0,0,0,.5);
}

.sidebar.open {
    left: 0;
}

.sidebar-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 22px;
    cursor: pointer;
}

.sidebar-close:hover {
    color: white;
}

.sidebar h3 {
    color: white;
    margin-bottom: 18px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-size: 13px;
}

.filter-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.filter-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 15px;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.25s;
    border: 1px solid transparent;
    background: rgba(255,255,255,.02);
}

.filter-list li:hover {
    background: rgba(59,130,246,.08);
    border-color: rgba(59,130,246,.25);
    transform: translateX(4px);
}

.filter-list li.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(59,130,246,.35);
}

.count {
    background: rgba(255,255,255,.12);
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 12px;
}

.filter-list li.active .count {
    background: white;
    color: var(--accent);
}

.price-filter {
    margin-top: 22px;
}

.price-value {
    margin-bottom: 12px;
    font-size: 14px;
}

#priceValue {
    color: var(--green);
    font-weight: bold;
}

#priceInput {
    width: 75px;
    margin-left: 8px;
    padding: 6px 8px;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
}

#priceSlider {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
}

.spec-filter {
    margin-top: 25px;
}

.spec-filter label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
}

.spec-filter select {
    width: 100%;
    padding: 9px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    outline: none;
    margin-bottom: 14px;
    cursor: pointer;
}

.spec-filter select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
}

.menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
    z-index: 200;
}

.menu-overlay.active {
    opacity: 1;
    pointer-events: all;
}

/* =========================
   PRODUCTS
========================= */

.products {
    flex: 1;
    min-width: 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
}

.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 15px 15px;
    text-align: center;
    transition: 0.25s ease;
    position: relative;
    overflow: hidden;
}

.card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(
        90deg,
        transparent,
        var(--accent),
        transparent
    );
    opacity: 0;
    transition: opacity 0.3s;
}

.card:hover {
    transform: translateY(-5px);
    border-color: rgba(59,130,246,0.4);
    box-shadow:
        0 8px 32px rgba(0,0,0,0.4),
        0 0 0 1px rgba(59,130,246,0.15);
    background: var(--surface2);
}

.card:hover::before {
    opacity: 1;
}

.card img {
    width: 100%;
    max-width: 270px;
    height: 145px;
    object-fit: contain;
    margin: 0 auto 12px;
    display: block;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
    transition: filter 0.3s;
}

.card:hover img {
    filter: drop-shadow(
        0 6px 18px rgba(59,130,246,0.2)
    );
}

.card h4 {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    color: #fff;
}

.price {
    color: var(--green);
    font-weight: 700;
    font-size: 16px;
    margin-top: 6px;
    text-shadow: 0 0 10px var(--green-glow);
}

.btn {
    margin-top: 12px;
    padding: 7px 18px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    transition: 0.2s;
    box-shadow: 0 0 12px var(--green-glow);
}

.btn:hover {
    background: #16a34a;
    transform: translateY(-1px);
    box-shadow: 0 0 20px var(--green-glow);
}

.no-results {
    display: none;
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
}

/* =========================
   CART
========================= */

.cart-sidebar {
    position: fixed;
    top: 0;
    right: -390px;
    width: 360px;
    max-width: 90%;
    height: 100vh;
    background: var(--surface);
    border-left: 1px solid var(--border);
    box-shadow: -10px 0 34px rgba(0,0,0,.5);
    z-index: 500;
    transition: right .35s ease;
    display: flex;
    flex-direction: column;
    padding: 22px;
}

.cart-sidebar.open {
    right: 0;
}

.cart-sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.cart-sidebar-header h3 {
    color: white;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-size: 15px;
}

.cart-sidebar-close {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 22px;
    cursor: pointer;
}

.cart-sidebar-close:hover {
    color: white;
}

.cart-items {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.cart-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: rgba(255,255,255,.02);
    border: 1px solid var(--border);
    border-radius: 12px;
}

.cart-item-img {
    width: 44px;
    height: 44px;
    object-fit: contain;
    border-radius: 8px;
    background: var(--surface2);
    flex-shrink: 0;
}

.cart-item-info {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
}

.cart-item-name {
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
}

.cart-item-price {
    color: var(--green);
    font-size: 13px;
    margin-top: 2px;
}

.cart-item-remove {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
}

.cart-item-remove:hover {
    color: #ef4444;
}

.cart-empty {
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    margin-top: 30px;
}

.cart-total {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text);
    font-size: 14px;
}

.cart-total span:last-child {
    color: var(--green);
    font-weight: 700;
    text-shadow: 0 0 10px var(--green-glow);
}

.cart-confirm-btn {
    margin-top: 16px;
    padding: 12px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 1px;
    transition: 0.2s;
    box-shadow: 0 0 14px var(--green-glow);
}

.cart-confirm-btn:hover {
    background: #16a34a;
    transform: translateY(-1px);
}

.cart-confirm-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
}

.cart-sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
    z-index: 490;
}

.cart-sidebar-overlay.active {
    opacity: 1;
    pointer-events: all;
}

/* =========================
   TABLET
========================= */

@media (max-width: 1000px) {

    .navbar {
        padding: 10px 18px;
    }

    .nav-right {
        gap: 7px;
    }

    .nav-button {
        padding: 8px 12px;
        font-size: 13px;
    }

    .search-box {
        width: 170px;
    }

    .container {
        padding: 0 16px;
    }

    .products {
        grid-template-columns: repeat(
            2,
            minmax(0, 1fr)
        );
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .navbar {
        padding: 10px 14px;
        display: grid;
        grid-template-columns: auto 1fr;
        grid-template-areas:
            "left cart"
            "actions actions";
        gap: 10px;
    }

    .nav-left {
        grid-area: left;
    }

    .logo {
        font-size: 20px;
        letter-spacing: 2px;
    }

    .cart-btn {
        grid-area: cart;
        justify-self: end;
    }

    .nav-right {
        grid-area: actions;
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
    }

    .nav-button {
        width: 100%;
        padding: 9px 6px;
        font-size: 12px;
    }

    .search-box {
        grid-column: 1 / -1;
        width: 100%;
        height: 40px;
    }

    .container {
        margin: 16px auto;
        padding: 0 12px;
    }

    .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .card {
        padding: 14px 10px 13px;
    }

    .card img {
        height: 120px;
    }

    .card h4 {
        font-size: 14px;
    }

    .price {
        font-size: 15px;
    }

    .btn {
        width: 100%;
        padding: 8px 10px;
    }

    .sidebar {
        width: min(320px, 85vw);
    }
}

/* =========================
   SMALL PHONES
========================= */

@media (max-width: 480px) {

    .navbar {
        padding: 9px 10px;
    }

    .menu-toggle {
        width: 34px;
        height: 34px;
    }

    .logo {
        font-size: 18px;
    }

    .cart-btn {
        width: 36px;
        height: 36px;
    }

    .nav-right {
        grid-template-columns: repeat(3, 1fr);
    }

    .nav-button {
        font-size: 11px;
        padding: 8px 3px;
    }

    .search-box {
        height: 38px;
        font-size: 12px;
    }

    .container {
        padding: 0 9px;
    }

    .products {
        grid-template-columns: 1fr 1fr;
        gap: 9px;
    }

    .card {
        border-radius: 11px;
        padding: 11px 7px;
    }

    .card img {
        height: 95px;
    }

    .card h4 {
        font-size: 12px;
    }

    .price {
        font-size: 13px;
    }

    .btn {
        font-size: 11px;
        margin-top: 9px;
        padding: 7px 5px;
    }

    .cart-sidebar {
        width: 92%;
        padding: 18px;
    }
}

/* =========================
   VERY SMALL PHONES
========================= */

@media (max-width: 350px) {

    .logo {
        font-size: 16px;
    }

    .products {
        grid-template-columns: 1fr;
    }

    .card img {
        height: 140px;
    }

    .nav-button {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

    <div class="nav-left">

        <button
            class="menu-toggle"
            id="menuToggle"
            aria-label="Toggle menu"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="logo">
            DEVPROS
        </div>

    </div>

    <div class="nav-right">

        <button
            class="nav-button"
            onclick="window.location.href='index.html'"
        >
            Home
        </button>

        <button
            class="nav-button"
            onclick="window.location.href='contact.html'"
        >
            Contact
        </button>

        <button
            class="nav-button"
            onclick="window.location.href='About.html'"
        >
            About Us
        </button>

        <input
            type="text"
            class="search-box"
            id="searchInput"
            placeholder="Search products..."
        >

    </div>

    <button
        class="cart-btn"
        id="cartToggle"
        aria-label="Open cart"
    >
        <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
        >
            <path
                d="M3 3H5L5.4 5M7 13H17L21 5H5.4M7 13L5.4 5M7 13L4.7 15.3C4.1 15.9 4.5 17 5.4 17H17M17 17C15.9 17 15 17.9 15 19C15 20.1 15.9 21 17 21C18.1 21 19 20.1 19 19C19 17.9 18.1 17 17 17ZM9 19C9 20.1 8.1 21 7 21C5.9 21 5 20.1 5 19C5 17.9 5.9 17 7 17C8.1 17 9 17 9 19Z"
                stroke="var(--green)"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            />
        </svg>

        <span
            class="cart-badge"
            id="cartBadge"
        >
            0
        </span>
    </button>

</nav>

<!-- =========================
     CART
========================= -->

<div
    class="cart-sidebar-overlay"
    id="cartOverlay"
></div>

<div
    class="cart-sidebar"
    id="cartSidebar"
>

    <div class="cart-sidebar-header">

        <h3>
            Your Cart
        </h3>

        <button
            class="cart-sidebar-close"
            id="cartSidebarClose"
            aria-label="Close cart"
        >
            &times;
        </button>

    </div>

    <div
        class="cart-items"
        id="cartItems"
    ></div>

    <div class="cart-total">

        <span>
            Total
        </span>

        <span id="cartTotal">
            $0
        </span>

    </div>

    <button
        class="cart-confirm-btn"
        id="confirmOrderBtn"
    >
        Confirm Order
    </button>

</div>

<!-- =========================
     MENU OVERLAY
========================= -->

<div
    class="menu-overlay"
    id="menuOverlay"
></div>

<!-- =========================
     MAIN
========================= -->

<div class="container">

    <!-- SIDEBAR -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <button
            class="sidebar-close"
            id="sidebarClose"
            aria-label="Close menu"
        >
            &times;
        </button>

        <h3>
            Filter By Brand
        </h3>

        <ul class="filter-list">

            <li
                class="active"
                data-brand="all"
            >
                <span>
                    All
                </span>

                <span class="count">
                    5
                </span>
            </li>

            <li data-brand="apple">
                <span>
                    Apple
                </span>

                <span class="count">
                    2
                </span>
            </li>

            <li data-brand="acer">
                <span>
                    Acer
                </span>

                <span class="count">
                    1
                </span>
            </li>

            <li data-brand="asus">
                <span>
                    Asus
                </span>

                <span class="count">

            </li>

            <li data-brand="dell">
                <span>

        <!-- PRICE -->

        <div class="price-filter">

            <div class="price-value">

                Max Price:

                <input

            </div>

            <input

            >

        <!-- SPECIFICATIONS -->

        <div class="spec-filter">

            <h3>
                Specifications
            </h3>

            <label for="ramFilter">
                RAM
            </label>

            <select id="ramFilter">

                <option value="all">
                    All
                </option>

                <option value="8GB">
                    8GB
                </option>

                <option value="12GB">
                    12GB
                </option>

                <option value="16GB">
                    16GB

                <option value="32GB">
                    32GB

            </select>

            <label for="processorFilter">
                Processor
            </label>

            <select id="processorFilter">

                <option value="all">
                    All
                </option>

                <option value="i3">

                </option>

                <option value="i5">
                    Intel i5
                </option>

                <option value="i7">
                    Intel i7
                </option>

                <option value="i9">
                    Intel i9
                </option>

                <option value="ryzen3">
                    AMD Ryzen 3
                </option>

                <option value="ryzen5">
                    AMD Ryzen 5
                </option>

                <option value="ryzen7">
                    AMD Ryzen 7
                </option>

                <option value="ryzen9">
                    AMD Ryzen 9
                </option>

            </select>

            <label for="gpuFilter">
                GPU (VRAM)
            </label>

            <select id="gpuFilter">

                <option value="all">
                    All
                </option>

                <option value="2GB">
                    2GB
                </option>

                <option value="4GB">
                    4GB
                </option>

                <option value="6GB">
                    6GB
                </option>

                <option value="8GB">
                    8GB
                </option>

            </select>

            <label for="screenFilter">
                Screen Size
            </label>

            <select id="screenFilter">

                <option value="all">
                    All
                </option>

                <option value="13.6">
                    13.6"
                </option>

                <option value="15.6">
                    15.6"
                </option>

                <option value="17.6">
                    17.6"
                </option>

            </select>

            <label for="storageFilter">
                Storage
            </label>

            <select id="storageFilter">

                <option value="all">
                    All
                </option>

                <option value="128GB">
                    128GB
                </option>

                <option value="256GB">
                    256GB
                </option>

                <option value="512GB">
                    512GB
                </option>

                <option value="1TB">
                    1TB
                </option>

            </select>

        </div>

    </aside>

    <!-- PRODUCTS -->

    <main class="products" id="products">

        <!-- MACBOOK -->

        <div
            class="card"
            data-brand="apple"
            data-price="650"
            data-ram="8GB"

            data-gpu="none"
            data-screen="13.6"
            data-storage="256GB"
        >

            <img
                src="website/images/Apple-MacBook-Air-2-up-front-240304-1536x612.webp"
                alt="Macbook Air 2025"
            >

            <h4>
                Macbook Air 2025
            </h4>

            <div class="price">
                $650
            </div>

            <button class="btn">

            </button>

        </div>

        <!-- ACER -->

        <div
            class="card"
            data-brand="acer"
            data-price="350"
            data-ram="8GB"
            data-processor="i5"
            data-gpu="2GB"
            data-screen="15.6"
            data-storage="512GB"
        >

            <img
                src="website/images/cde9877d-9c98-4b2b-96c5-c23f9d94ec24.jpg"
                alt="Acer Aspire 5"
            >

            <h4>
                Acer Aspire 5
            </h4>

            <div class="price">
                $350
            </div>

            <button class="btn">
                Buy
            </button>

        </div>

        <!-- ASUS -->

        <div
            class="card"
            data-brand="asus"
            data-price="420"
            data-ram="16GB"
            data-processor="i7"
            data-gpu="4GB"
            data-screen="15.6"
            data-storage="512GB"
        >

            <img
                src="website/images/res_4f9b3e6f45190e356241ff1361d3e248.avif"
                alt="Asus TUF F15"
            >

            <h4>
                Asus TUF F15
            </h4>

            <div class="price">
                $420
            </div>

            <button class="btn">
                Buy
            </button>

        </div>

        <!-- IPHONE -->

        <div
            class="card"
            data-brand="apple"
            data-price="1119"
            data-ram="12GB"
            data-processor="none"
            data-gpu="none"
            data-screen="6.9"
            data-storage="256GB"
        >

            <img
                src="website/images/apple-iphone-17-pro-max-cosmic-orange.webp"
                alt="iPhone 17 Pro Max"
            >

            <h4>
                iPhone 17 Pro Max
            </h4>

            <div class="price">
                $1,119
            </div>

            <button class="btn">
                Buy
            </button>

        </div>

        <!-- DELL -->

        <div
            class="card"
            data-brand="dell"
            data-price="545"
            data-ram="16GB"
            data-processor="i7"
            data-gpu="6GB"
            data-screen="17.6"
            data-storage="1TB"
        >

            <img
                src="website/images/download.webp"
                alt="Dell G17"
            >

            <h4>
                Dell G17
            </h4>

            <div class="price">
                $545
            </div>

            <button class="btn">
                Buy
            </button>

        </div>

        <div
            class="no-results"
            id="noResults"
        >
            No products found.
        </div>

    </main>

</div>

<script>

/* =========================
   ELEMENTS
========================= */

const priceInput = document.getElementById("priceInput");
const priceSlider = document.getElementById("priceSlider");

const categories = document.querySelectorAll(".filter-list li");
const cards = document.querySelectorAll(".card");

const ramFilter = document.getElementById("ramFilter");
const processorFilter = document.getElementById("processorFilter");
const gpuFilter = document.getElementById("gpuFilter");
const screenFilter = document.getElementById("screenFilter");
const storageFilter = document.getElementById("storageFilter");

const searchInput = document.getElementById("searchInput");
const noResults = document.getElementById("noResults");

const navbar = document.querySelector(".navbar");
const menuToggle = document.getElementById("menuToggle");
const sidebar = document.getElementById("sidebar");
const menuOverlay = document.getElementById("menuOverlay");
const sidebarClose = document.getElementById("sidebarClose");

const cartToggle = document.getElementById("cartToggle");
const cartSidebar = document.getElementById("cartSidebar");
const cartOverlay = document.getElementById("cartOverlay");
const cartSidebarClose = document.getElementById("cartSidebarClose");
const cartItemsEl = document.getElementById("cartItems");
const cartTotalEl = document.getElementById("cartTotal");
const cartBadge = document.getElementById("cartBadge");
const confirmOrderBtn = document.getElementById("confirmOrderBtn");

let currentBrand = "all";
let cart = [];

/* =========================
   NAVBAR HEIGHT
========================= */

function syncNavbarHeight() {

    document.documentElement.style.setProperty(
        "--navbar-h",
        navbar.offsetHeight + "px"
    );

}

syncNavbarHeight();

window.addEventListener(
    "resize",
    syncNavbarHeight
);

window.addEventListener(
    "load",
    syncNavbarHeight
);

/* =========================
   SIDEBAR
========================= */

function openMenu() {

    sidebar.classList.add("open");
    menuOverlay.classList.add("active");
    menuToggle.classList.add("active");

}

function closeMenu() {

    sidebar.classList.remove("open");
    menuOverlay.classList.remove("active");
    menuToggle.classList.remove("active");

}

menuToggle.addEventListener(
    "click",
    () => {

        if (sidebar.classList.contains("open")) {
            closeMenu();
        } else {
            openMenu();
        }

    }
);

menuOverlay.addEventListener(
    "click",
    closeMenu
);

sidebarClose.addEventListener(
    "click",
    closeMenu
);

/* =========================
   NAVBAR SCROLL
========================= */

let lastScroll = 0;

window.addEventListener(
    "scroll",
    () => {

        const currentScroll = window.pageYOffset;

        if (
            currentScroll > lastScroll &&
            currentScroll > 80
        ) {

            navbar.classList.add("hide");

        } else {

            navbar.classList.remove("hide");

        }

        lastScroll = currentScroll;

    },
    { passive: true }
);

/* =========================
   FILTERS
========================= */

function applyAllFilters() {

    const maxPrice = Number(priceInput.value) || 0;

    const ramVal = ramFilter.value;
    const processorVal = processorFilter.value;
    const gpuVal = gpuFilter.value;
    const screenVal = screenFilter.value;
    const storageVal = storageFilter.value;

    const searchValue =
        searchInput.value
            .trim()
            .toLowerCase();

    let visibleProducts = 0;

    cards.forEach(card => {

        const price =
            Number(card.dataset.price);

        const name =
            card.querySelector("h4")
                .textContent
                .toLowerCase();

        const matchesBrand =
            currentBrand === "all" ||
            card.dataset.brand === currentBrand;

        const matchesPrice =
            price <= maxPrice;

        const matchesRam =
            ramVal === "all" ||
            card.dataset.ram === ramVal;

        const matchesProcessor =
            processorVal === "all" ||
            card.dataset.processor === processorVal;

        const matchesGpu =
            gpuVal === "all" ||
            card.dataset.gpu === gpuVal;

        const matchesScreen =
            screenVal === "all" ||
            card.dataset.screen === screenVal;

        const matchesStorage =
            storageVal === "all" ||
            card.dataset.storage === storageVal;

        const matchesSearch =
            searchValue === "" ||
            name.includes(searchValue);

        const visible =
            matchesBrand &&
            matchesPrice &&
            matchesRam &&
            matchesProcessor &&
            matchesGpu &&
            matchesScreen &&
            matchesStorage &&
            matchesSearch;

        if (visible) {

            card.style.display = "";

            visibleProducts++;

            card.animate(
                [
                    {
                        opacity: 0,
                        transform: "translateY(12px)"
                    },
                    {
                        opacity: 1,
                        transform: "translateY(0)"
                    }
                ],
                {
                    duration: 250,
                    fill: "forwards"
                }
            );

        } else {

            card.style.display = "none";

        }

    });

    noResults.style.display =
        visibleProducts === 0
            ? "block"
            : "none";

}

/* BRAND */

categories.forEach(category => {

    category.addEventListener(
        "click",
        () => {

            categories.forEach(item =>
                item.classList.remove("active")
            );

            category.classList.add("active");

            currentBrand =
                category.dataset.brand;

            applyAllFilters();

            if (window.innerWidth <= 768) {
                closeMenu();
            }

        }
    );

});

/* PRICE SLIDER */

priceSlider.addEventListener(
    "input",
    () => {

        priceInput.value =
            priceSlider.value;

        applyAllFilters();

    }
);

/* PRICE INPUT */

priceInput.addEventListener(
    "input",
    () => {

        let value =
            Number(priceInput.value);

        if (value < 0) {
            value = 0;
        }

        if (value > 2000) {
            value = 2000;
        }

        priceInput.value = value;
        priceSlider.value = value;

        applyAllFilters();

    }
);

/* SELECT FILTERS */

ramFilter.addEventListener(
    "change",
    applyAllFilters
);

processorFilter.addEventListener(
    "change",
    applyAllFilters
);

gpuFilter.addEventListener(
    "change",
    applyAllFilters
);

screenFilter.addEventListener(
    "change",
    applyAllFilters
);

storageFilter.addEventListener(
    "change",
    applyAllFilters
);

/* SEARCH */

searchInput.addEventListener(
    "input",
    applyAllFilters
);

/* =========================
   CART
========================= */

function renderCart() {

    cartItemsEl.innerHTML = "";

    if (cart.length === 0) {

        cartItemsEl.innerHTML =
            '<div class="cart-empty">Your cart is empty</div>';

    } else {

        cart.forEach(
            (item, index) => {

                const itemEl =
                    document.createElement("div");

                itemEl.className =
                    "cart-item";

                itemEl.innerHTML = `

                    <img
                        class="cart-item-img"
                        src="${item.img}"
                        alt="${item.name}"
                    >

                    <div class="cart-item-info">

                        <span class="cart-item-name">
                            ${item.name}
                        </span>

                        <span class="cart-item-price">
                            $${item.price.toLocaleString()}
                        </span>

                    </div>

                    <button
                        class="cart-item-remove"
                        data-index="${index}"
                    >
                        &times;
                    </button>

                `;

                cartItemsEl.appendChild(
                    itemEl
                );

            }
        );

    }

    const total =
        cart.reduce(
            (sum, item) =>
                sum + item.price,
            0
        );

    cartTotalEl.textContent =
        "$" + total.toLocaleString();

    if (cart.length > 0) {

        cartBadge.style.display =
            "flex";

        cartBadge.textContent =
            cart.length;

    } else {

        cartBadge.style.display =
            "none";

    }

    document
        .querySelectorAll(".cart-item-remove")
        .forEach(removeBtn => {

            removeBtn.addEventListener(
                "click",
                () => {

                    const index =
                        Number(
                            removeBtn.dataset.index
                        );

                    cart.splice(index, 1);

                    renderCart();

                }
            );

        });

}

function openCart() {

    cartSidebar.classList.add("open");
    cartOverlay.classList.add("active");

}

function closeCart() {

    cartSidebar.classList.remove("open");
    cartOverlay.classList.remove("active");

}

cartToggle.addEventListener(
    "click",
    openCart
);

cartOverlay.addEventListener(
    "click",
    closeCart
);

cartSidebarClose.addEventListener(
    "click",
    closeCart
);

/* =========================
   BUY BUTTONS
========================= */

document
    .querySelectorAll(".card .btn")
    .forEach(buyBtn => {

        buyBtn.addEventListener(
            "click",
            () => {

                const card =
                    buyBtn.closest(".card");

                const name =
                    card.querySelector("h4")
                        .textContent;

                const price =
                    Number(
                        card.dataset.price
                    );

                const img =
                    card.querySelector("img")
                        .getAttribute("src");

                cart.push({
                    name,
                    price,
                    img
                });

                renderCart();
                openCart();

            }
        );

    });

/* =========================
   CONFIRM ORDER
========================= */

confirmOrderBtn.addEventListener(
    "click",
    () => {

        if (cart.length === 0) {
            return;
        }

        const total =
            cart.reduce(
                (sum, item) =>
                    sum + item.price,
                0
            );

        let message =
            "New order from DEVPROS website:\n\n";

        cart.forEach(item => {

            message +=
                item.name +
                " - $" +
                item.price.toLocaleString() +
                "\n";

        });

        message +=
            "\nTotal: $" +
            total.toLocaleString();

        confirmOrderBtn.disabled = true;
        confirmOrderBtn.textContent =
            "Sending...";

        fetch(
            "https://formspree.io/f/mbgrypdk",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "Accept":
                        "application/json"
                },

                body: JSON.stringify({
                    email:
                        "eiadtaha2020@gmai.com",

                    message:
                        message
                })
            }
        )
        .then(response => {

            if (response.ok) {

                confirmOrderBtn.textContent =
                    "Order Sent!";

                cart = [];

                renderCart();

                setTimeout(
                    () => {

                        confirmOrderBtn.disabled =
                            false;

                        confirmOrderBtn.textContent =
                            "Confirm Order";

                        closeCart();

                    },
                    1800
                );

            } else {

                throw new Error(
                    "Request failed"
                );

            }

        })
        .catch(() => {

            confirmOrderBtn.disabled =
                false;

            confirmOrderBtn.textContent =
                "Failed, Try Again";

        });

    }
);

/* =========================
   INITIALIZE
========================= */

renderCart();
applyAllFilters();

</script>

</body>
</html>
