<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products Page</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;500&display=swap');
body{
    opacity: 0;
    transform: scale(0.98);
    filter: blur(5px);

    animation: pageLoad 0.9s ease forwards;
}

@keyframes pageLoad{
    to{
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }
}

:root {
  --bg: #0a0e1a;
  --surface: #111827;
  --surface2: #1a2236;
  --border: rgba(99,179,237,0.15);
  --accent: #3b82f6;
  --accent-glow: rgba(59,130,246,0.35);
  --green: #22c55e;
  --green-glow: rgba(34,197,94,0.3);
  --text: #e2e8f0;
  --text-muted: #64748b;
  --navbar-h: 60px;
}

* { margin:0; padding:0; box-sizing:border-box; }

html{
  -webkit-text-size-adjust:100%;
}

body {
  background: var(--bg);
  font-family: 'Inter', sans-serif;
  color: var(--text);
  min-height: 100vh;
  overflow-x:hidden;
  background-image:
    radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(99,102,241,0.07) 0%, transparent 60%);
}


.navbar {
  background: rgba(10,14,26,0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 30px;
  min-height: var(--navbar-h);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 300;
  flex-wrap: wrap;
  transition: transform 0.35s ease;
}

.navbar.hide{
  transform: translateY(-100%);
}

.nav-left{
  display:flex;
  align-items:center;
  gap:16px;
}

.menu-toggle{
  width:36px;
  height:36px;
  background:transparent;
  border:1px solid var(--border);
  border-radius:8px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:5px;
  cursor:pointer;
  transition:.2s;
  flex-shrink:0;
}

.menu-toggle:hover{
  border-color:var(--accent);
  box-shadow:0 0 14px var(--accent-glow);
}

.menu-toggle span{
  display:block;
  width:18px;
  height:2px;
  background:var(--text);
  border-radius:2px;
  transition:.25s;
}

.menu-toggle.active span:nth-child(1){
  transform:translateY(7px) rotate(45deg);
}
.menu-toggle.active span:nth-child(2){
  opacity:0;
}
.menu-toggle.active span:nth-child(3){
  transform:translateY(-7px) rotate(-45deg);
}

.logo {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 22px;
  letter-spacing: 3px;
  color: #fff;
  text-shadow: 0 0 20px var(--accent-glow);
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.home-btn {
  padding: 8px 18px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 1px;
  transition: all 0.2s;
  box-shadow: 0 0 14px var(--accent-glow);
  position: relative;
  right: 850px;
  
}

.home-btn:hover {
  background: #4f7ad6;
  transform: translateY(-2px);
  box-shadow: 0 0 10px var(--accent-glow);
}

.navbar input {
  padding: 8px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  outline: none;
  width: 200px;
  max-width: 100%;
  transition: border-color 0.2s, box-shadow 0.2s;
  position: relative;
  right: 50px;
}

.navbar input::placeholder { color: var(--text-muted); }

.navbar input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.container{
    display:flex;
    align-items:flex-start;
    gap:20px;
    max-width:1400px;
    margin:24px auto;
    padding:0 20px;
}

.sidebar{
    width:260px;
    background:var(--surface);
    border:1px solid var(--border);
    padding:22px;
    position:fixed;
    top:var(--navbar-h);
    left:-300px;
    height:calc(100vh - var(--navbar-h));
    overflow-y:auto;
    z-index:250;
    transition:left .35s ease;
    box-shadow:10px 0 34px rgba(0,0,0,.5);
    border-radius:0 18px 18px 0;
}

.sidebar.open{
    left:0;
}

.sidebar-close{
    position:absolute;
    top:14px;
    right:14px;
    background:transparent;
    border:none;
    color:var(--text-muted);
    font-size:22px;
    line-height:1;
    cursor:pointer;
}

.sidebar-close:hover{
    color:#fff;
}

.menu-overlay{
    position:fixed;
    top:var(--navbar-h);
    left:0;
    right:0;
    bottom:0;
    background:rgba(0,0,0,.55);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
    z-index:200;
}

.menu-overlay.active{
    opacity:1;
    pointer-events:all;
}

.sidebar h3{
    color:white;
    margin-bottom:18px;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:13px;
}

.filter-list{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.filter-list li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 15px;
    border-radius:12px;
    cursor:pointer;
    transition:.25s;
    border:1px solid transparent;
    background:rgba(255,255,255,.02);
}

.filter-list li:hover{
    background:rgba(59,130,246,.08);
    border-color:rgba(59,130,246,.25);
    transform:translateX(4px);
}

.filter-list li.active{
    background:var(--accent);
    color:white;
    border-color:var(--accent);
    box-shadow:0 0 18px rgba(59,130,246,.35);
}

.count{
    background:rgba(255,255,255,.12);
    padding:3px 9px;
    border-radius:20px;
    font-size:12px;
}

.filter-list li.active .count{
    background:white;
    color:var(--accent);
}


.products{
    flex:1;
    min-width:0;
    width:100%;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 15px 15px;
  text-align: center;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}

.card:hover {
  transform: translateY(-5px);
  border-color: rgba(59,130,246,0.4);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(59,130,246,0.15);
  background: var(--surface2);
}

.card:hover::before { opacity: 1; }

.card img {
  width: 270px;
  height: 145px;
  object-fit: contain;
  margin-bottom: 12px;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  transition: filter 0.3s;
  max-width: 100%;

}

.card:hover img {
  filter: drop-shadow(0 6px 18px rgba(59,130,246,0.2));
}

.card h4 {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 15px;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
  color: #fff;
}

.price {
  color: var(--green);
  font-weight: 700;
  font-size: 16px;
  margin-top: 6px;
  text-shadow: 0 0 10px var(--green-glow);
}

.btn {
  margin-top: 12px;
  padding: 7px 18px;
  background: var(--green);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  transition: all 0.2s;
  box-shadow: 0 0 12px var(--green-glow);
}

.btn:hover {
  background: #16a34a;
  transform: translateY(-1px);
  box-shadow: 0 0 20px var(--green-glow);
}

.price-filter{
    margin-top:15px;
}

.price-value{
    margin-bottom:12px;
    font-size:14px;
    color:var(--text);
}

#priceValue{
    color:var(--green);
    font-weight:bold;
}

#priceSlider{
    width:100%;
    accent-color:var(--accent);
    cursor:pointer;
}
#priceInput{
    width: 60px;
    margin-left:10px;
    padding:6px;
    background:var(--surface2);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:6px;
    outline:none;

}
.contact-btn{
  padding: 8px 11px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 1px;
  transition: all 0.2s;
  box-shadow: 0 0 14px var(--accent-glow);
  right: 850px;
  position: relative;
}
.contact-btn:hover {
  background: #4f7ad6;
  transform: translateY(-2px);
  box-shadow: 0 0 10px var(--accent-glow);
}

.about-us{
  padding: 8px 11px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 1px;
  transition: all 0.2s;
  box-shadow: 0 0 14px var(--accent-glow);
  position: relative;
  right: 850px;
}
.about-us:hover{
  background: #4f7ad6;
  transform: translateY(-2px);
  box-shadow: 0 0 10px var(--accent-glow);
}

.spec-filter{
    margin-top:22px;
}

.spec-filter label{
    display:block;
    font-size:12px;
    color:var(--text-muted);
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:6px;
}

.spec-filter select{
    width:100%;
    padding:9px 10px;
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    font-size:13px;
    outline:none;
    margin-bottom:14px;
    cursor:pointer;
    transition:border-color 0.2s, box-shadow 0.2s;
}

.spec-filter select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-glow);
}

.spec-filter select:last-child{
    margin-bottom:0;
}

@media (max-width: 900px) {
  .container{
    padding:0 16px;
  }
}

@media (max-width: 768px) {

  .navbar {
    flex-direction: column;
    align-items: stretch;
    height: auto;
    padding: 14px 16px;
    gap: 12px;
  }

  .nav-left{
    width:100%;
    justify-content:space-between;
  }

  .nav-right {
    width: 100%;
    flex-direction: column;
    gap: 10px;
  }

  .navbar input {
    width: 100%;
  }

  .home-btn, .contact-btn, .about-us {
    width: 100%;
  }

  .container{
    margin:16px auto;
    padding:0 14px;
  }

  .products {
    grid-template-columns: 1fr;
    gap:14px;
  }

  .card {
    width: 100%;
  }

  .card img {
    width: 100%;
    height: auto;
  }

  .sidebar{
    width:82%;
    max-width:320px;
    padding:20px;
  }

}

@media (max-width: 480px) {

  .logo{
    font-size:18px;
    letter-spacing:2px;
  }

  .menu-toggle{
    width:32px;
    height:32px;
  }

  .container{
    padding:0 10px;
    margin:14px auto;
  }

  .card{
    padding:14px 10px 12px;
  }

  .card h4{
    font-size:14px;
  }

  .price{
    font-size:14px;
  }

  .btn{
    padding:6px 14px;
    font-size:11px;
  }

  .sidebar{
    width:90%;
    max-width:280px;
    padding:16px;
  }

  .spec-filter select, #priceInput, .navbar input{
    font-size:12px;
  }

  .home-btn, .contact-btn, .about-us{
    font-size:13px;
    padding:8px 14px;
  }

}

.cart-btn {
  width: 40px;
  height: 40px;
  padding: 0;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
  position: relative;
  left: 1480px;
  bottom: 50px;
  z-index: 400;
}

.cart-btn:hover {
  border-color: var(--green);
  box-shadow: 0 0 14px var(--green-glow);
}

.cart-btn svg {
  width: 20px;
  height: 20px;
}

.cart-badge {
  position: absolute;
  top: -6px;
  right: -6px;
  background: var(--green);
  color: white;
  font-size: 11px;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  border-radius: 9px;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  box-shadow: 0 0 8px var(--green-glow);
}

.cart-sidebar {
  position: fixed;
  top: 0;
  right: -380px;
  width: 340px;
  max-width: 85%;
  height: 100vh;
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: -10px 0 34px rgba(0,0,0,.5);
  z-index: 500;
  transition: right .35s ease;
  display: flex;
  flex-direction: column;
  padding: 22px;
}

.cart-sidebar.open {
  right: 0;
}

.cart-sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.cart-sidebar-header h3 {
  color: white;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-size: 15px;
}

.cart-sidebar-close {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
}

.cart-sidebar-close:hover {
  color: #fff;
}

.cart-items {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.cart-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: rgba(255,255,255,.02);
  border: 1px solid var(--border);
  border-radius: 12px;
}

.cart-item-img {
  width: 44px;
  height: 44px;
  object-fit: contain;
  border-radius: 8px;
  background: var(--surface2);
  flex-shrink: 0;
}

.cart-item-info {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
}

.cart-item-name {
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
}

.cart-item-price {
  color: var(--green);
  font-size: 13px;
  margin-top: 2px;
}

.cart-item-remove {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
  line-height: 1;
}

.cart-item-remove:hover {
  color: #ef4444;
}

.cart-empty {
  color: var(--text-muted);
  font-size: 13px;
  text-align: center;
  margin-top: 30px;
}

.cart-total {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--text);
  font-size: 14px;
}

.cart-total span:last-child {
  color: var(--green);
  font-weight: 700;
  text-shadow: 0 0 10px var(--green-glow);
}

.cart-confirm-btn {
  margin-top: 16px;
  padding: 12px;
  background: var(--green);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 1px;
  transition: all 0.2s;
  box-shadow: 0 0 14px var(--green-glow);
}

.cart-confirm-btn:hover {
  background: #16a34a;
  transform: translateY(-1px);
  box-shadow: 0 0 20px var(--green-glow);
}

.cart-sidebar-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,.55);
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s ease;
  z-index: 490;
}

.cart-sidebar-overlay.active {
  opacity: 1;
  pointer-events: all;
}

@media (max-width: 480px) {
  .cart-sidebar {
    width: 300px;
    padding: 18px;
  }
}


</style>
</head>
<body>

<div class="navbar">
  <div class="nav-left">
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="logo">DEVPROS</div>
  </div>
  <div class="nav-right">
    <button class="home-btn" onclick="window.location.href='index.html'">Home</button>
    <button class="contact-btn" onclick="window.location.href='contact.html'">Contact</button>
    <button class="about-us" onclick="window.location.href='About.html'">About Us</button>
    <input type="text" placeholder="Search products...">
  </div>
</div>
<button class="cart-btn" id="cartToggle" aria-label="Cart">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M3 3H5L5.4 5M7 13H17L21 5H5.4M7 13L5.4 5M7 13L4.7 15.3C4.1 15.9 4.5 17 5.4 17H17M17 17C15.9 17 15 17.9 15 19C15 20.1 15.9 21 17 21C18.1 21 19 20.1 19 19C19 17.9 18.1 17 17 17ZM9 19C9 20.1 8.1 21 7 21C5.9 21 5 20.1 5 19C5 17.9 5.9 17 7 17C8.1 17 9 17.9 9 19Z" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <span class="cart-badge" id="cartBadge">0</span>
</button>

<div class="cart-sidebar-overlay" id="cartOverlay"></div>

<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-sidebar-header">
    <h3>Your Cart</h3>
    <button class="cart-sidebar-close" id="cartSidebarClose" aria-label="Close cart">&times;</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-total">
    <span>Total</span>
    <span id="cartTotal">$0</span>
  </div>
  <button class="cart-confirm-btn" id="confirmOrderBtn">Confirm Order</button>
</div>

<div class="menu-overlay" id="menuOverlay"></div>

<div class="container">

<div class="sidebar" id="sidebar">

<button class="sidebar-close" id="sidebarClose" aria-label="Close menu">&times;</button>

<h3>Filter By Brand</h3>

<ul class="filter-list">
<li class="active" data-brand="all">
<span>All</span>
<span class="count">4</span>
</li>

<li data-brand="apple">
<span>Apple</span>
<span class="count">1</span>
</li>

<li data-brand="acer">
<span>Acer</span>
<span class="count">1</span>
</li>

<li data-brand="asus">
<span>Asus</span>
<span class="count">1</span>
</li>

<li data-brand="dell">
<span>Dell</span>
<span class="count">1</span>
</li>

</ul>

<div class="price-filter">

    <div class="price-value">
        Max Price:
        <input
            type="number"
            id="priceInput"
            min="0"
            max="700"
            value="700"
        >
    </div>

    <input
        type="range"
        id="priceSlider"
        min="0"
        max="700"
        value="700"
    >

</div>

<div class="spec-filter">

    <h3 style="margin-top:4px;">Specifications</h3>

    <label for="ramFilter">RAM</label>
    <select id="ramFilter">
        <option value="all">All</option>
        <option value="8GB">8GB</option>
        <option value="16GB">16GB</option>
        <option value="32GB">32GB</option>
    </select>

    <label for="processorFilter">Processor</label>
    <select id="processorFilter">
        <option value="all">All</option>
        <option value="i3">Intel i3</option>
        <option value="i5">Intel i5</option>
        <option value="i7">Intel i7</option>
        <option value="i9">Intel i9</option>
        <option value="ryzen3">AMD Ryzen 3</option>
        <option value="ryzen5">AMD Ryzen 5</option>
        <option value="ryzen7">AMD Ryzen 7</option>
        <option value="ryzen9">AMD Ryzen 9</option>
    </select>

    <label for="gpuFilter">GPU (VRAM)</label>
    <select id="gpuFilter">
        <option value="all">All</option>
        <option value="2GB">2GB</option>
        <option value="4GB">4GB</option>
        <option value="6GB">6GB</option>
        <option value="8GB">8GB</option>
    </select>

    <label for="screenFilter">Screen Size</label>

<script>
const priceInput = document.getElementById("priceInput");
const categories = document.querySelectorAll(".filter-list li");
const cards = document.querySelectorAll(".card");

const slider = document.getElementById("priceSlider");
let currentBrand = "all";

const ramFilter = document.getElementById("ramFilter");
const processorFilter = document.getElementById("processorFilter");
const gpuFilter = document.getElementById("gpuFilter");
const screenFilter = document.getElementById("screenFilter");
const storageFilter = document.getElementById("storageFilter");

function applyAllFilters(){

    const maxPrice = Number(priceInput.value);
    const ramVal = ramFilter.value;
    const processorVal = processorFilter.value;
    const gpuVal = gpuFilter.value;
    const screenVal = screenFilter.value;
    const storageVal = storageFilter.value;

    cards.forEach(card=>{

        const price = Number(card.dataset.price);

        const matchesBrand = currentBrand === "all" || card.dataset.brand === currentBrand;
        const matchesPrice = price <= maxPrice;
        const matchesRam = ramVal === "all" || card.dataset.ram === ramVal;
        const matchesProcessor = processorVal === "all" || card.dataset.processor === processorVal;
        const matchesGpu = gpuVal === "all" || card.dataset.gpu === gpuVal;
        const matchesScreen = screenVal === "all" || card.dataset.screen === screenVal;
        const matchesStorage = storageVal === "all" || card.dataset.storage === storageVal;

        if(matchesBrand && matchesPrice && matchesRam && matchesProcessor && matchesGpu && matchesScreen && matchesStorage){

            card.style.display = "block";

            card.animate([
                {opacity:0,transform:"translateY(20px)"},
                {opacity:1,transform:"translateY(0)"}
            ],{
                duration:300,
                fill:"forwards"
            });

        } else {

            card.style.display = "none";

        }

    });

}

categories.forEach(category=>{

category.addEventListener("click",()=>{

categories.forEach(item=>item.classList.remove("active"));
category.classList.add("active");

currentBrand = category.dataset.brand;

applyAllFilters();

if(window.innerWidth <= 768){
    closeMenu();
}

});

});

slider.addEventListener("input", () => {

    priceInput.value = slider.value;

    applyAllFilters();

});
priceInput.addEventListener("input", () => {

    slider.value = priceInput.value;

    applyAllFilters();

});

ramFilter.addEventListener("change", applyAllFilters);
processorFilter.addEventListener("change", applyAllFilters);
gpuFilter.addEventListener("change", applyAllFilters);
screenFilter.addEventListener("change", applyAllFilters);
storageFilter.addEventListener("change", applyAllFilters);

const navbar = document.querySelector(".navbar");
const menuToggle = document.getElementById("menuToggle");
const sidebar = document.getElementById("sidebar");
const menuOverlay = document.getElementById("menuOverlay");
const sidebarClose = document.getElementById("sidebarClose");

function syncNavbarHeight(){
    document.documentElement.style.setProperty("--navbar-h", navbar.offsetHeight + "px");
}

syncNavbarHeight();
window.addEventListener("resize", syncNavbarHeight);
window.addEventListener("load", syncNavbarHeight);

let lastScroll = 0;

window.addEventListener("scroll", () => {
    let current = window.pageYOffset;
    if (current > lastScroll && current > 80) {
        navbar.classList.add("hide");
    } else {
        navbar.classList.remove("hide");
    }
    lastScroll = current;
});

function openMenu(){
    sidebar.classList.add("open");
    menuOverlay.classList.add("active");
    menuToggle.classList.add("active");
}

function closeMenu(){
    sidebar.classList.remove("open");
    menuOverlay.classList.remove("active");
    menuToggle.classList.remove("active");
}

menuToggle.addEventListener("click", () => {
    if(sidebar.classList.contains("open")){
        closeMenu();
    } else {
        openMenu();
    }
});

menuOverlay.addEventListener("click", closeMenu);
sidebarClose.addEventListener("click", closeMenu);

let cart = [];

const cartToggle = document.getElementById("cartToggle");
const cartSidebar = document.getElementById("cartSidebar");
const cartOverlay = document.getElementById("cartOverlay");
const cartSidebarClose = document.getElementById("cartSidebarClose");
const cartItemsEl = document.getElementById("cartItems");
const cartTotalEl = document.getElementById("cartTotal");
const cartBadge = document.getElementById("cartBadge");
const confirmOrderBtn = document.getElementById("confirmOrderBtn");

function renderCart(){

    cartItemsEl.innerHTML = "";

    if(cart.length === 0){
        cartItemsEl.innerHTML = '<div class="cart-empty">Your cart is empty</div>';
    } else {
        cart.forEach((item, index) => {

            const itemEl = document.createElement("div");
            itemEl.className = "cart-item";
            itemEl.innerHTML = `
                <img class="cart-item-img" src="${item.img}" alt="${item.name}">
                <div class="cart-item-info">
                    <span class="cart-item-name">${item.name}</span>
                    <span class="cart-item-price">$${item.price}</span>
                </div>
                <button class="cart-item-remove" data-index="${index}">&times;</button>
            `;
            cartItemsEl.appendChild(itemEl);

        });
    }

    const total = cart.reduce((sum, item) => sum + item.price, 0);
    cartTotalEl.textContent = "$" + total;

    if(cart.length > 0){
        cartBadge.style.display = "flex";
        cartBadge.textContent = cart.length;
    } else {
        cartBadge.style.display = "none";
    }

    document.querySelectorAll(".cart-item-remove").forEach(removeBtn => {
        removeBtn.addEventListener("click", () => {
            const index = Number(removeBtn.dataset.index);
            cart.splice(index, 1);
            renderCart();
        });
    });

}

function openCart(){
    cartSidebar.classList.add("open");
    cartOverlay.classList.add("active");
}

function closeCart(){
    cartSidebar.classList.remove("open");
    cartOverlay.classList.remove("active");
}

cartToggle.addEventListener("click", openCart);
cartOverlay.addEventListener("click", closeCart);
cartSidebarClose.addEventListener("click", closeCart);

document.querySelectorAll(".card .btn").forEach(buyBtn => {

    buyBtn.addEventListener("click", () => {

        const card = buyBtn.closest(".card");
        const name = card.querySelector("h4").textContent;
        const price = Number(card.dataset.price);
        const img = card.querySelector("img").getAttribute("src");

        cart.push({ name, price, img });

        renderCart();
        openCart();

    });

});

confirmOrderBtn.addEventListener("click", () => {

    if(cart.length === 0){
        return;
    }

    const total = cart.reduce((sum, item) => sum + item.price, 0);

    let message = "New order from DEVPROS website:\n\n";

    cart.forEach(item => {
        message += item.name + " - $" + item.price + "\n";
    });

    message += "\nTotal: $" + total;

    confirmOrderBtn.disabled = true;
    confirmOrderBtn.textContent = "Sending...";

    fetch("https://formspree.io/f/mbgrypdk", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
        },
        body: JSON.stringify({
            email: "eiadtaha2020@gmai.com",
            message: message
        })
    })
    .then(response => {
        if(response.ok){
            confirmOrderBtn.textContent = "Order Sent!";
            cart = [];
            renderCart();
            setTimeout(() => {
                confirmOrderBtn.disabled = false;
                confirmOrderBtn.textContent = "Confirm Order";
                closeCart();
            }, 1800);
        } else {
            confirmOrderBtn.disabled = false;
            confirmOrderBtn.textContent = "Failed, Try Again";
        }
    })
    .catch(() => {
        confirmOrderBtn.disabled = false;
        confirmOrderBtn.textContent = "Failed, Try Again";
    });

});

renderCart();

</script>
