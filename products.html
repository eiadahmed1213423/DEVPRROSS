<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>DEVPROS Products</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2236;
    --border: rgba(99,179,237,0.15);

    --accent: #3b82f6;
    --accent-glow: rgba(59,130,246,0.35);

    --green: #22c55e;
    --green-glow: rgba(34,197,94,0.3);

    --text: #e2e8f0;
    --muted: #64748b;

    --navbar-height: 64px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    width: 100%;
    min-width: 100%;
    overflow-x: hidden;
}

body {
    width: 100%;
    min-width: 0;
    max-width: 100vw;

    margin: 0;
    padding: 0;

    overflow-x: hidden;

    background: var(--bg);
    color: var(--text);

    font-family: 'Inter', sans-serif;

    background-image:
        radial-gradient(
            ellipse 80% 50% at 20% 10%,
            rgba(59,130,246,0.08) 0%,
            transparent 60%
        ),
        radial-gradient(
            ellipse 60% 40% at 80% 80%,
            rgba(99,102,241,0.07) 0%,
            transparent 60%
        );
}

/* =========================================================
   NAVBAR
========================================================= */

.navbar {
    width: 100%;
    max-width: 100vw;

    min-height: var(--navbar-height);

    padding: 10px 28px;

    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;

    gap: 25px;

    background: rgba(10,14,26,0.92);

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    border-bottom: 1px solid var(--border);

    position: sticky;
    top: 0;

    z-index: 1000;
}

.nav-left {
    display: flex;
    align-items: center;
    gap: 14px;

    min-width: 0;
}

.logo {
    color: white;

    text-decoration: none;

    font-family: 'Rajdhani', sans-serif;

    font-size: 24px;
    font-weight: 700;

    letter-spacing: 3px;

    white-space: nowrap;
}

/* MENU BUTTON */

.menu-toggle {
    width: 40px;
    height: 40px;

    border: 1px solid var(--border);
    border-radius: 8px;

    background: var(--surface2);

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    gap: 5px;

    cursor: pointer;

    flex-shrink: 0;
}

.menu-toggle span {
    width: 19px;
    height: 2px;

    background: white;

    border-radius: 5px;

    transition: 0.25s;
}

.menu-toggle:hover {
    border-color: var(--accent);
    box-shadow: 0 0 15px var(--accent-glow);
}

.menu-toggle.active span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
}

.menu-toggle.active span:nth-child(2) {
    opacity: 0;
}

.menu-toggle.active span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
}

/* NAV LINKS */

.nav-links {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 6px;

    min-width: 0;
}

.nav-links a {
    color: var(--text);

    text-decoration: none;

    font-family: 'Rajdhani', sans-serif;

    font-size: 14px;
    font-weight: 600;

    padding: 9px 14px;

    border-radius: 8px;

    transition: 0.2s;
}

.nav-links a:hover,
.nav-links a.active {
    color: white;

    background: rgba(59,130,246,0.15);
}

/* NAV ACTIONS */

.nav-actions {
    display: flex;
    align-items: center;

    gap: 10px;

    min-width: 0;
}

.search-box {
    width: 210px;
    height: 40px;

    padding: 0 13px;

    background: var(--surface2);

    border: 1px solid var(--border);
    border-radius: 8px;

    color: var(--text);

    outline: none;
}

.search-box::placeholder {
    color: var(--muted);
}

.search-box:focus {
    border-color: var(--accent);

    box-shadow:
        0 0 0 3px var(--accent-glow);
}

/* CART BUTTON */

.cart-btn {
    width: 40px;
    height: 40px;

    border: 1px solid var(--border);
    border-radius: 8px;

    background: var(--surface2);

    color: white;

    cursor: pointer;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    transition: 0.2s;
}

.cart-btn:hover {
    border-color: var(--green);

    box-shadow:
        0 0 15px var(--green-glow);
}

.cart-icon {
    width: 20px;
    height: 20px;
}

.cart-badge {
    position: absolute;

    top: -7px;
    right: -7px;

    min-width: 18px;
    height: 18px;

    padding: 0 5px;

    border-radius: 20px;

    background: var(--green);

    color: white;

    font-size: 10px;
    font-weight: 700;

    display: none;

    align-items: center;
    justify-content: center;
}

/* =========================================================
   MAIN CONTAINER
========================================================= */

.container {
    width: 100%;
    max-width: 1400px;

    margin: 24px auto;

    padding: 0 20px;

    display: flex;
    align-items: flex-start;

    gap: 20px;

    min-width: 0;
}

/* =========================================================
   SIDEBAR
========================================================= */

/*
    IMPORTANT:

    The sidebar is FIXED and completely outside
    the normal page layout.

    Therefore it CANNOT create a strip on the
    left side of the mobile page.
*/

.sidebar {
    position: fixed;

    top: var(--navbar-height);
    left: 0;

    width: 280px;
    height: calc(100vh - var(--navbar-height));

    padding: 22px;

    background: var(--surface);

    border-right: 1px solid var(--border);

    box-shadow:
        10px 0 35px rgba(0,0,0,0.45);

    overflow-y: auto;

    z-index: 2000;

    /*
        CLOSED STATE
    */

    transform: translateX(-105%);

    visibility: hidden;

    pointer-events: none;

    transition:
        transform 0.3s ease,
        visibility 0.3s ease;
}

/*
    OPEN STATE
*/

.sidebar.open {
    transform: translateX(0);

    visibility: visible;

    pointer-events: auto;
}

/* SIDEBAR CLOSE */

.sidebar-close {
    position: absolute;

    top: 12px;
    right: 12px;

    width: 32px;
    height: 32px;

    border: none;

    background: transparent;

    color: var(--muted);

    font-size: 24px;

    cursor: pointer;
}

.sidebar-close:hover {
    color: white;
}

.sidebar h3 {
    margin-bottom: 18px;

    color: white;

    font-family: 'Rajdhani', sans-serif;

    font-size: 14px;

    letter-spacing: 1.5px;

    text-transform: uppercase;
}

/* FILTER LIST */

.filter-list {
    list-style: none;

    display: flex;
    flex-direction: column;

    gap: 8px;
}

.filter-list li {
    width: 100%;

    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 11px 13px;

    border-radius: 10px;

    background: rgba(255,255,255,0.02);

    border: 1px solid transparent;

    cursor: pointer;

    transition: 0.2s;
}

.filter-list li:hover {
    background: rgba(59,130,246,0.08);

    border-color: rgba(59,130,246,0.25);
}

.filter-list li.active {
    background: var(--accent);

    color: white;

    border-color: var(--accent);

    box-shadow:
        0 0 18px rgba(59,130,246,0.3);
}

.count {
    padding: 3px 8px;

    border-radius: 20px;

    background: rgba(255,255,255,0.1);

    font-size: 11px;
}

.filter-list li.active .count {
    background: white;

    color: var(--accent);
}

/* PRICE */

.price-filter {
    margin-top: 25px;
}

.price-value {
    font-size: 13px;

    margin-bottom: 10px;
}

#priceValue {
    color: var(--green);

    font-weight: 700;
}

#priceInput {
    width: 75px;

    padding: 6px 8px;

    margin-left: 6px;

    background: var(--surface2);

    border: 1px solid var(--border);

    border-radius: 6px;

    color: white;

    outline: none;
}

#priceSlider {
    width: 100%;

    accent-color: var(--accent);

    cursor: pointer;
}

/* SPEC FILTER */

.spec-filter {
    margin-top: 25px;
}

.spec-filter label {
    display: block;

    margin-bottom: 6px;

    color: var(--muted);

    font-size: 11px;

    letter-spacing: 1px;

    text-transform: uppercase;
}

.spec-filter select {
    width: 100%;

    padding: 9px 10px;

    margin-bottom: 14px;

    background: var(--surface2);

    border: 1px solid var(--border);

    border-radius: 8px;

    color: var(--text);

    outline: none;

    cursor: pointer;
}

/* MENU OVERLAY */

.menu-overlay {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.6);

    z-index: 1900;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
}

.menu-overlay.active {
    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}

/* =========================================================
   PRODUCTS
========================================================= */

.products {
    width: 100%;

    min-width: 0;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px, 1fr)
        );

    gap: 16px;
}

/* PRODUCT CARD */

.card {
    width: 100%;
    min-width: 0;

    padding: 17px 14px;

    background: var(--surface);

    border: 1px solid var(--border);

    border-radius: 14px;

    text-align: center;

    overflow: hidden;

    position: relative;

    transition: 0.25s ease;
}

.card:hover {
    transform: translateY(-5px);

    background: var(--surface2);

    border-color:
        rgba(59,130,246,0.4);

    box-shadow:
        0 8px 30px rgba(0,0,0,0.4);
}

.card img {
    display: block;

    width: 100%;
    max-width: 270px;

    height: 145px;

    margin: 0 auto 12px;

    object-fit: contain;
}

.card h4 {
    color: white;

    font-family: 'Rajdhani', sans-serif;

    font-size: 15px;

    font-weight: 600;

    line-height: 1.3;

    overflow-wrap: anywhere;
}

.price {
    margin-top: 6px;

    color: var(--green);

    font-size: 16px;

    font-weight: 700;

    text-shadow:
        0 0 10px var(--green-glow);
}

.btn {
    width: auto;

    margin-top: 12px;

    padding: 8px 18px;

    border: none;

    border-radius: 8px;

    background: var(--green);

    color: white;

    cursor: pointer;

    font-size: 12px;

    font-weight: 600;

    box-shadow:
        0 0 12px var(--green-glow);

    transition: 0.2s;
}

.btn:hover {
    background: #16a34a;

    transform: translateY(-1px);
}

/* NO RESULTS */

.no-results {
    display: none;

    grid-column: 1 / -1;

    padding: 60px 20px;

    text-align: center;

    color: var(--muted);
}

/* =========================================================
   CART
========================================================= */

.cart-overlay {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.6);

    z-index: 2900;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition: 0.3s;
}

.cart-overlay.active {
    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}

.cart-sidebar {
    position: fixed;

    top: 0;
    right: 0;

    width: 370px;
    max-width: 92vw;

    height: 100vh;

    padding: 22px;

    background: var(--surface);

    border-left: 1px solid var(--border);

    box-shadow:
        -10px 0 35px rgba(0,0,0,0.5);

    z-index: 3000;

    transform: translateX(105%);

    visibility: hidden;

    pointer-events: none;

    transition:
        transform 0.3s ease,
        visibility 0.3s ease;

    display: flex;
    flex-direction: column;
}

.cart-sidebar.open {
    transform: translateX(0);

    visibility: visible;

    pointer-events: auto;
}

.cart-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 20px;
}

.cart-header h3 {
    color: white;

    font-family: 'Rajdhani', sans-serif;

    letter-spacing: 2px;
}

.cart-close {
    border: none;

    background: transparent;

    color: var(--muted);

    font-size: 25px;

    cursor: pointer;
}

.cart-close:hover {
    color: white;
}

.cart-items {
    flex: 1;

    overflow-y: auto;

    display: flex;
    flex-direction: column;

    gap: 10px;
}

.cart-empty {
    margin-top: 30px;

    text-align: center;

    color: var(--muted);

    font-size: 13px;
}

.cart-item {
    display: flex;

    align-items: center;

    gap: 10px;

    padding: 10px;

    background: var(--surface2);

    border: 1px solid var(--border);

    border-radius: 10px;
}

.cart-item img {
    width: 45px;
    height: 45px;

    object-fit: contain;

    flex-shrink: 0;
}

.cart-item-info {
    flex: 1;

    min-width: 0;
}

.cart-item-name {
    display: block;

    color: white;

    font-size: 12px;

    font-weight: 600;
}

.cart-item-price {
    display: block;

    margin-top: 3px;

    color: var(--green);

    font-size: 12px;
}

.remove-item {
    border: none;

    background: transparent;

    color: var(--muted);

    font-size: 20px;

    cursor: pointer;
}

.remove-item:hover {
    color: #ef4444;
}

.cart-total {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding-top: 16px;

    margin-top: 15px;

    border-top: 1px solid var(--border);

    font-size: 14px;
}

.cart-total-value {
    color: var(--green);

    font-weight: 700;
}

.confirm-order {
    width: 100%;

    margin-top: 15px;

    padding: 12px;

    border: none;

    border-radius: 8px;

    background: var(--green);

    color: white;

    cursor: pointer;

    font-family: 'Rajdhani', sans-serif;

    font-size: 14px;

    font-weight: 600;

    letter-spacing: 1px;
}

/* =========================================================
   TABLET
========================================================= */

@media (max-width: 1000px) {

    .navbar {
        padding: 10px 18px;

        grid-template-columns:
            auto
            1fr
            auto;

        gap: 12px;
    }

    .nav-links a {
        padding: 8px 8px;

        font-size: 12px;
    }

    .search-box {
        width: 150px;
    }

    .container {
        padding: 0 15px;
    }

    .products {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 768px) {

    html,
    body {
        width: 100%;
        max-width: 100vw;

        overflow-x: hidden;
    }

    /*
        MOBILE NAVBAR
    */

    .navbar {
        width: 100%;
        max-width: 100vw;

        grid-template-columns: 1fr auto;

        grid-template-areas:
            "left cart"
            "links links"
            "search search";

        gap: 9px;

        padding: 9px 11px;
    }

    .nav-left {
        grid-area: left;
    }

    .logo {
        font-size: 20px;

        letter-spacing: 2px;
    }

    .menu-toggle {
        width: 37px;
        height: 37px;
    }

    .cart-btn {
        grid-area: cart;

        width: 37px;
        height: 37px;
    }

    .nav-links {
        grid-area: links;

        width: 100%;

        display: grid;

        grid-template-columns:
            repeat(4, minmax(0, 1fr));

        gap: 5px;
    }

    .nav-links a {
        width: 100%;

        padding: 8px 2px;

        text-align: center;

        font-size: 11px;
    }

    .nav-actions {
        grid-area: search;

        width: 100%;
    }

    .search-box {
        width: 100%;

        height: 38px;

        font-size: 12px;
    }

    /*
        MOBILE CONTAINER

        No sidebar inside the layout.
    */

    .container {
        width: 100%;
        max-width: 100vw;

        margin: 15px 0;

        padding: 0 10px;

        display: block;

        overflow: visible;
    }

    /*
        SIDEBAR

        CLOSED:
        completely outside the viewport.
    */

    .sidebar {
        position: fixed;

        top: 0;
        left: 0;

        width: min(310px, 82vw);

        height: 100vh;

        padding-top: 70px;

        /*
            THIS IS THE IMPORTANT PART
        */

        transform: translateX(-110%);

        visibility: hidden;

        pointer-events: none;

        z-index: 5000;
    }

    /*
        OPEN:
        only now does it appear.
    */

    .sidebar.open {
        transform: translateX(0);

        visibility: visible;

        pointer-events: auto;
    }

    /*
        MOBILE PRODUCTS
    */

    .products {
        width: 100%;
        max-width: 100%;

        min-width: 0;

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 10px;
    }

    .card {
        width: 100%;
        min-width: 0;

        padding: 12px 7px;

        border-radius: 11px;
    }

    .card img {
        width: 100%;
        max-width: 100%;

        height: 105px;
    }

    .card h4 {
        font-size: 12px;

        line-height: 1.25;
    }

    .price {
        font-size: 13px;
    }

    .btn {
        width: 100%;

        padding: 8px 4px;

        font-size: 11px;
    }

    /*
        CART MOBILE
    */

    .cart-sidebar {
        width: 92vw;
        max-width: 370px;

        transform: translateX(105%);
    }

    .cart-sidebar.open {
        transform: translateX(0);
    }
}

/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width: 480px) {

    .logo {
        font-size: 18px;
    }

    .nav-links a {
        font-size: 10px;

        padding: 8px 1px;
    }

    .products {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 8px;
    }

    .card {
        padding: 10px 6px;
    }

    .card img {
        height: 90px;
    }

    .card h4 {
        font-size: 11px;
    }

    .price {
        font-size: 12px;
    }

    .btn {
        font-size: 10px;

        padding: 7px 3px;
    }
}

/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 350px) {

    .products {
        grid-template-columns: 1fr;
    }

    .card img {
        height: 130px;
    }

    .card h4 {
        font-size: 13px;
    }

    .price {
        font-size: 14px;
    }

    .btn {
        font-size: 11px;
    }
}

</style>
</head>

<body>

<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar">

    <div class="nav-left">

        <button
            class="menu-toggle"
            id="menuToggle"
            aria-label="Open filters"
            type="button"
        >

            <span></span>
            <span></span>
            <span></span>

        </button>

        <a
            href="index.html"
            class="logo"
        >
            DEVPROS
        </a>

    </div>


    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a
            href="products.html"
            class="active"
        >
            Products
        </a>

        <a href="contact.html">
            Contact
        </a>

        <a href="About.html">
            About Us
        </a>

    </div>


    <div class="nav-actions">

        <input
            type="text"
            class="search-box"
            id="searchInput"
            placeholder="Search products..."
        >

    </div>


    <button
        class="cart-btn"
        id="cartToggle"
        type="button"
        aria-label="Open cart"
    >

        <svg
            class="cart-icon"
            viewBox="0 0 24 24"
            fill="none"
        >

            <path
                d="M3 3H5L5.4 5M7 13H17L21 5H5.4M7 13L5.4 5M7 13L4.7 15.3C4.1 15.9 4.5 17 5.4 17H17M17 17C15.9 17 15 17.9 15 19C15 20.1 15.9 21 17 21C18.1 21 19 20.1 19 19C19 17.9 18.1 17 17 17ZM9 19C9 20.1 8.1 21 7 21C5.9 21 5 20.1 5 19C5 17.9 5.9 17 7 17C8.1 17 9 17 9 19Z"
                stroke="var(--green)"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            />

        </svg>

        <span
            class="cart-badge"
            id="cartBadge"
        >
            0
        </span>

    </button>

</nav>


<!-- =====================================================
     MENU OVERLAY
===================================================== -->

<div
    class="menu-overlay"
    id="menuOverlay"
></div>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside
    class="sidebar"
    id="sidebar"
>

    <button
        class="sidebar-close"
        id="sidebarClose"
        type="button"
        aria-label="Close filters"
    >
        ×
    </button>


    <h3>
        Filter By Brand
    </h3>


    <ul class="filter-list">

        <li
            class="active"
            data-brand="all"
        >

            <span>
                All
            </span>

            <span class="count">
                5
            </span>

        </li>


        <li data-brand="apple">

            <span>
                Apple
            </span>

            <span class="count">
                2
            </span>

        </li>


        <li data-brand="acer">

            <span>
                Acer
            </span>

            <span class="count">
                1
            </span>

        </li>


        <li data-brand="asus">

            <span>
                Asus
            </span>

            <span class="count">
                1
            </span>

        </li>


        <li data-brand="dell">

            <span>
                Dell
            </span>

<script>

/* =========================================================
   MENU
========================================================= */

const menuToggle =
    document.getElementById("menuToggle");

const sidebar =
    document.getElementById("sidebar");

const menuOverlay =
    document.getElementById("menuOverlay");

const sidebarClose =
    document.getElementById("sidebarClose");


function openMenu() {

    sidebar.classList.add("open");

    menuOverlay.classList.add("active");

    menuToggle.classList.add("active");

    document.body.style.overflow = "hidden";
}


function closeMenu() {

    sidebar.classList.remove("open");

    menuOverlay.classList.remove("active");

    menuToggle.classList.remove("active");

    document.body.style.overflow = "";
}


menuToggle.addEventListener(
    "click",
    function () {

        if (
            sidebar.classList.contains("open")
        ) {

            closeMenu();

        } else {

            openMenu();

        }

    }
);


sidebarClose.addEventListener(
    "click",
    closeMenu
);


menuOverlay.addEventListener(
    "click",
    closeMenu
);


/* =========================================================
   CLOSE MENU WHEN CLICKING A FILTER
========================================================= */

document
    .querySelectorAll(".filter-list li")
    .forEach(item => {

        item.addEventListener(
            "click",
            function () {

                if (
                    window.innerWidth <= 768
                ) {
                    closeMenu();
                }

            }
        );

    });


/* =========================================================
   FILTERS
========================================================= */

const cards =
    document.querySelectorAll(".card");

const searchInput =
    document.getElementById("searchInput");

const priceInput =
    document.getElementById("priceInput");

const priceSlider =
    document.getElementById("priceSlider");

const ramFilter =
    document.getElementById("ramFilter");

const processorFilter =
    document.getElementById("processorFilter");

const gpuFilter =
    document.getElementById("gpuFilter");

const screenFilter =
    document.getElementById("screenFilter");

const storageFilter =
    document.getElementById("storageFilter");

const noResults =
    document.getElementById("noResults");

let selectedBrand = "all";


function applyFilters() {

    const maxPrice =
        Number(priceInput.value);

    const search =
        searchInput.value
            .trim()
            .toLowerCase();

    const ram =
        ramFilter.value;

    const processor =
        processorFilter.value;

    const gpu =
        gpuFilter.value;

    const screen =
        screenFilter.value;

    const storage =
        storageFilter.value;

    let visible = 0;


    cards.forEach(card => {

        const name =
            card
                .querySelector("h4")
                .textContent
                .toLowerCase();

        const price =
            Number(card.dataset.price);


        const brandMatch =
            selectedBrand === "all" ||
            card.dataset.brand === selectedBrand;


        const priceMatch =
            price <= maxPrice;


        const ramMatch =
            ram === "all" ||
            card.dataset.ram === ram;


        const processorMatch =
            processor === "all" ||
            card.dataset.processor === processor;


        const gpuMatch =
            gpu === "all" ||
            card.dataset.gpu === gpu;


        const screenMatch =
            screen === "all" ||
            card.dataset.screen === screen;


        const storageMatch =
            storage === "all" ||
            card.dataset.storage === storage;


        const searchMatch =
            search === "" ||
            name.includes(search);


        const show =
            brandMatch &&
            priceMatch &&
            ramMatch &&
            processorMatch &&
            gpuMatch &&
            screenMatch &&
            storageMatch &&
            searchMatch;


        card.style.display =
            show ? "" : "none";


        if (show) {
            visible++;
        }

    });


    noResults.style.display =
        visible === 0
            ? "block"
            : "none";

}


/* BRAND */

document
    .querySelectorAll(".filter-list li")
    .forEach(item => {

        item.addEventListener(
            "click",
            function () {

                document
                    .querySelectorAll(".filter-list li")
                    .forEach(
                        x =>
                            x.classList.remove(
                                "active"
                            )
                    );


                this.classList.add("active");


                selectedBrand =
                    this.dataset.brand;


                applyFilters();

            }
        );

    });


/* PRICE */

priceSlider.addEventListener(
    "input",
    function () {

        priceInput.value =
            this.value;

        applyFilters();

    }
);


priceInput.addEventListener(
    "input",
    function () {

        let value =
            Number(this.value);


        if (value < 0) {
            value = 0;
        }


        if (value > 2000) {
            value = 2000;
        }


        this.value = value;

        priceSlider.value = value;

        applyFilters();

    }
);


/* SELECTS */

ramFilter.addEventListener(
    "change",
    applyFilters
);

processorFilter.addEventListener(
    "change",
    applyFilters
);

gpuFilter.addEventListener(
    "change",
    applyFilters
);

screenFilter.addEventListener(
    "change",
    applyFilters
);

storageFilter.addEventListener(
    "change",
    applyFilters
);


/* SEARCH */

searchInput.addEventListener(
    "input",
    applyFilters
);


/* =========================================================
   CART
========================================================= */

const cartToggle =
    document.getElementById("cartToggle");

const cartSidebar =
    document.getElementById("cartSidebar");

const cartOverlay =
    document.getElementById("cartOverlay");

const cartClose =
    document.getElementById("cartClose");

const cartItems =
    document.getElementById("cartItems");

const cartTotal =
    document.getElementById("cartTotal");

const cartBadge =
    document.getElementById("cartBadge");

const confirmOrder =
    document.getElementById("confirmOrder");


let cart = [];


function openCart() {

    cartSidebar.classList.add("open");

    cartOverlay.classList.add("active");

    document.body.style.overflow = "hidden";

}


function closeCart() {

    cartSidebar.classList.remove("open");

    cartOverlay.classList.remove("active");

    document.body.style.overflow = "";

}


cartToggle.addEventListener(
    "click",
    openCart
);


cartClose.addEventListener(
    "click",
    closeCart
);


cartOverlay.addEventListener(
    "click",
    closeCart
);


/* =========================================================
   ADD TO CART
========================================================= */

document
    .querySelectorAll(".card .btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            function () {

                const card =
                    this.closest(".card");


                const name =
                    card
                        .querySelector("h4")
                        .textContent;


                const price =
                    Number(
                        card.dataset.price
                    );


                const image =
                    card
                        .querySelector("img")
                        .src;


                cart.push({
                    name: name,
                    price: price,
                    image: image
                });


                renderCart();

                openCart();

            }
        );

    });


/* =========================================================
   RENDER CART
========================================================= */

function renderCart() {

    cartItems.innerHTML = "";


    if (cart.length === 0) {

        cartItems.innerHTML =
            '<div class="cart-empty">Your cart is empty.</div>';

    }


    cart.forEach(
        (item, index) => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "cart-item";


            element.innerHTML = `

                <img
                    src="${item.image}"
                    alt="${item.name}"
                >

                <div class="cart-item-info">

                    <span class="cart-item-name">
                        ${item.name}
                    </span>

                    <span class="cart-item-price">
                        $${item.price.toLocaleString()}
                    </span>

                </div>

                <button
                    class="remove-item"
                    type="button"
                    data-index="${index}"
                >
                    ×
                </button>

            `;


            cartItems.appendChild(
                element
            );

        }
    );


    document
        .querySelectorAll(".remove-item")
        .forEach(button => {

            button.addEventListener(
                "click",
                function () {

                    const index =
                        Number(
                            this.dataset.index
                        );


                    cart.splice(
                        index,
                        1
                    );


                    renderCart();

                }
            );

        });


    const total =
        cart.reduce(
            (sum, item) =>
                sum + item.price,
            0
        );


    cartTotal.textContent =
        "$" + total.toLocaleString();


    if (cart.length > 0) {

        cartBadge.style.display =
            "flex";

        cartBadge.textContent =
            cart.length;

    } else {

        cartBadge.style.display =
            "none";

    }

}


/* =========================================================
   CONFIRM ORDER
========================================================= */

confirmOrder.addEventListener(
    "click",
    function () {

        if (cart.length === 0) {
            return;
        }


        let message =
            "New DEVPROS Order\n\n";


        cart.forEach(item => {

            message +=
                item.name +
                " - $" +
                item.price.toLocaleString() +
                "\n";

        });


        const total =
            cart.reduce(
                (sum, item) =>
                    sum + item.price,
                0
            );


        message +=
            "\nTotal: $" +
            total.toLocaleString();


        confirmOrder.disabled = true;

        confirmOrder.textContent =
            "Sending...";


        fetch(
            "https://formspree.io/f/mbgrypdk",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "Accept":
                        "application/json"
                },

                body: JSON.stringify({

                    email:
                        "eiadtaha2020@gmai.com",

                    message:
                        message

                })

            }
        )
        .then(response => {

            if (!response.ok) {
                throw new Error(
                    "Order failed"
                );
            }


            confirmOrder.textContent =
                "Order Sent!";


            cart = [];


            renderCart();


            setTimeout(
                function () {

                    confirmOrder.disabled =
                        false;

                    confirmOrder.textContent =
                        "Confirm Order";

                    closeCart();

                },
                1500
            );

        })
        .catch(
            function () {

                confirmOrder.disabled =
                    false;

                confirmOrder.textContent =
                    "Try Again";

            }
        );

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

renderCart();

applyFilters();


/*
    IMPORTANT:
    Make absolutely sure the sidebar starts closed.
*/

sidebar.classList.remove("open");

menuOverlay.classList.remove("active");

menuToggle.classList.remove("active");

</script>
